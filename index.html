<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바로가기</title>
<style>
  :root{
    --bg:#161616;
    --panel:#1e1e1e;
    --line:#3a3a3a;
    --text-hi:#f0efe9;
    --text-lo:#9a9890;
    --accent:#ff7a3d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--bg);
    color:var(--text-hi);
    font-family:-apple-system,'Segoe UI','Pretendard',sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  form{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:10px;
    border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,.4);
  }
  input{
    width:260px;
    padding:12px 14px;
    background:#262626;
    border:1px solid var(--line);
    color:var(--text-hi);
    border-radius:7px;
    font-size:14px;
    outline:none;
  }
  input::placeholder{color:var(--text-lo);}
  input:focus{border-color:var(--accent);}
  button{
    padding:12px 18px;
    background:var(--accent);
    border:none;
    color:#1a0d05;
    font-weight:600;
    font-size:14px;
    border-radius:7px;
    cursor:pointer;
  }
  button:hover{background:#ff8a54;}
  button:active{transform:translateY(1px);}
</style>
</head>
<body>

  <form id="goForm">
    <input id="filenameInput" type="text" placeholder="파일명" autocomplete="off" autofocus>
    <button type="submit">이동</button>
  </form>

<script>
  const form = document.getElementById('goForm');
  const input = document.getElementById('filenameInput');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let name = input.value.trim();
    if (!name) { input.focus(); return; }

    // 이미 .html로 끝나면 중복으로 붙이지 않음
    if (!/\.html?$/i.test(name)) name += '.html';

    const base = window.location.href;
    window.location.href = base + name;
  });
</script>
</body>
</html>
