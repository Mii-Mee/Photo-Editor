<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바로가기</title>
<style>
  :root{
    --bg:#161616;
    --panel:#1e1e1e;
    --line:#3a3a3a;
    --text-hi:#f0efe9;
    --text-lo:#9a9890;
    --accent:#ff7a3d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--bg);
    color:var(--text-hi);
    font-family:-apple-system,'Segoe UI','Pretendard',sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  form{
    display:flex;
    flex-direction:column;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:10px;
    border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,.4);
  }
  .row{display:flex;gap:8px;}
  select{
    padding:12px 14px;
    background:#262626;
    border:1px solid var(--line);
    color:var(--text-hi);
    border-radius:7px;
    font-size:14px;
    outline:none;
    cursor:pointer;
  }
  select:focus{border-color:var(--accent);}
  input{
    width:100%;
    padding:12px 14px;
    background:#262626;
    border:1px solid var(--line);
    color:var(--text-hi);
    border-radius:7px;
    font-size:14px;
    outline:none;
  }
  input::placeholder{color:var(--text-lo);}
  input:focus{border-color:var(--accent);}
  button{
    padding:12px 18px;
    background:var(--accent);
    border:none;
    color:#1a0d05;
    font-weight:600;
    font-size:14px;
    border-radius:7px;
    cursor:pointer;
  }
  button:hover{background:#ff8a54;}
  button:active{transform:translateY(1px);}
</style>
</head>
<body>

  <form id="goForm">
    <div class="row">
      <select id="presetSelect">
        <option value="__custom__">직접입력</option>
        <option value="photo-editor">photo-editor</option>
        <option value="psd-viewer">psd-viewer</option>
        <option value="nuki-studio">nuki-studio</option>
      </select>
      <button type="submit">이동</button>
    </div>
    <input id="filenameInput" type="text" placeholder="파일명" autocomplete="off" autofocus>
  </form>

<script>
  const form = document.getElementById('goForm');
  const select = document.getElementById('presetSelect');
  const input = document.getElementById('filenameInput');

  function syncInputVisibility(){
    const isCustom = select.value === '__custom__';
    input.style.display = isCustom ? 'block' : 'none';
    if (isCustom) input.focus();
  }
  select.addEventListener('change', syncInputVisibility);
  syncInputVisibility();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let name = select.value === '__custom__' ? input.value.trim() : select.value;
    if (!name) { input.focus(); return; }

    // 이미 .html로 끝나면 중복으로 붙이지 않음
    if (!/\.html?$/i.test(name)) name += '.html';

    const base = window.location.href;
    window.location.href = base + name;
  });
</script>
</body>
</html>
